name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Verify release tag matches application version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          grep -F "versionName \"${GITHUB_REF_NAME#v}\"" android/app/build.gradle
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run licenses:npm
      - run: npm run sbom
      - run: npx cap sync android
      - name: Android release gates and SBOM
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug cyclonedxBom --console=plain
      - name: Enable KVM for the emulator
        run: sudo chmod 666 /dev/kvm
      - name: Android emulator privacy tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --console=plain
      - run: npm run licenses
      - run: npm run audit:osv
      - run: git diff --exit-code
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore isolated Vita release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VITA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vita-release.jks"
          chmod 600 "$RUNNER_TEMP/vita-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          VITA_KEYSTORE_PATH: ${{ runner.temp }}/vita-release.jks
          VITA_KEYSTORE_PASSWORD: ${{ secrets.VITA_KEYSTORE_PASSWORD }}
          VITA_KEY_ALIAS: ${{ secrets.VITA_KEY_ALIAS }}
          VITA_KEY_PASSWORD: ${{ secrets.VITA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Inspect signed APK
        env:
          APK: android/app/build/outputs/apk/release/app-release.apk
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          BUILD_TOOLS_DIR="$(dirname "$APKSIGNER")"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$APKANALYZER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          ! grep -qi 'Android Debug' apk-signature.txt
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep -F "package: name='io.github.lztpho.vita'"
          unzip -l "$APK" > apk-files.txt
          ! grep -Ei '\.map$|google-services|firebase' apk-files.txt
          "$APKANALYZER" manifest permissions "$APK" | sort -u > apk-permissions.txt
          diff -u <(printf '%s\n' android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_DATA_SYNC android.permission.INTERNET io.github.lztpho.vita.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort) apk-permissions.txt
      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Vita-${GITHUB_REF_NAME}.apk"
          cp build/npm-sbom.cdx.json npm-sbom.cdx.json
          cp android/build/reports/cyclonedx/bom.json android-sbom.cdx.json
          sha256sum "Vita-${GITHUB_REF_NAME}.apk" > "Vita-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Vita-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: Vita ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Vita-${{ github.ref_name }}.apk
            Vita-${{ github.ref_name }}.apk.sha256
            npm-sbom.cdx.json
            android-sbom.cdx.json
            build/npm-licenses.json
            build/android-licenses.json
            THIRD_PARTY_NOTICES.md
