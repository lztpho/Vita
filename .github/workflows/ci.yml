name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run licenses:npm
      - run: npm run sbom
      - run: npx cap sync android
      - name: Android tests, lint, APKs, and SBOM
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug :app:assembleRelease cyclonedxBom --console=plain
      - name: Enable KVM for the emulator
        run: sudo chmod 666 /dev/kvm
      - name: Android emulator privacy tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --console=plain
      - run: npm run licenses
      - run: npm run audit:osv
      - name: Verify generated sources are committed
        run: git diff --exit-code
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vita-verification-artifacts
          if-no-files-found: error
          path: |
            build/npm-sbom.cdx.json
            build/npm-licenses.json
            build/android-licenses.json
            android/build/reports/cyclonedx/bom.json
            android/app/build/reports/lint-results-debug.html
